[project]
name = "dbua-pytorch"
version = "0.1.0"
description = "Differentiable beamforming by unrolled adaptive (DBUA) ultrasound reconstruction — PyTorch port"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "torch>=2.4",
    "numpy>=1.25",
    "matplotlib>=3.7",
    "tqdm>=4.66",
    "hdf5storage>=0.1.19",
    "jax[cuda12]>=0.10.2 ; sys_platform == 'linux'",
    "jaxopt>=0.8.5",
    "optax>=0.2.8",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
# Lock for both the Linux/CUDA deploy target and macOS dev machines.
environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'darwin'",
]
